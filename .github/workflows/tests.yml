name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        browser: [chromium, firefox]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
        run: uv run pytest -v --browser ${{ matrix.browser }} --tracing retain-on-failure --screenshot only-on-failure --alluredir=allure-results

      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload test artifacts to S3
        if: always()
        run: |
          if [ -d "test-results" ]; then
            aws s3 cp test-results/ s3://maryna-aqa-portfolio-artifacts/run-${{ github.run_id }}-py${{ matrix.python-version }}-${{ matrix.browser }}/ --recursive
          else
            echo "No test-results directory found - nothing to upload (likely all tests passed)"
          fi

      - name: Upload Allure results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-py${{ matrix.python-version }}-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30

      - name: Generate Allure HTML report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-py${{ matrix.python-version }}-${{ matrix.browser }}
          path: allure-report/
          retention-days: 30

  notify:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on any failure
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "CI failed on ${{ github.repository }} - branch ${{ github.ref_name }}, run ${{ github.run_id }}. Check the Actions tab for which combination(s) failed."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
