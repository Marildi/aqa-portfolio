[project]
name = "aqa-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.0",
    "factory-boy>=3.3.3",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.9.0",
    "pytest-rerunfailures>=16.5",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "pentest: tests malicious payloads",
    "custom: for step 45 testing"
]
